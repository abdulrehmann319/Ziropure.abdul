<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14100e">
<meta name="description" content="Ziorpure hair and personal care essentials">
<title>Ziorpure | Healthy Hair, Beautiful You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--noir:#14100e;--noir2:#1e1815;--gold:#c8a96a;--gold2:#e2cc9b;--ivory:#f4eee4;--sand:#e9e0d1;--stone:#8d8378;--ink:#201a16}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:'Jost',sans-serif;color:var(--ink);background:var(--ivory);-webkit-font-smoothing:antialiased;font-weight:400}
a{color:inherit;text-decoration:none}:focus-visible{outline:1px solid var(--gold);outline-offset:4px}
.announcement{background:var(--gold);color:var(--noir);text-align:center;padding:9px;font-size:13px;font-weight:500;letter-spacing:.04em}
header{position:sticky;top:0;z-index:10;background:#14100ef0;backdrop-filter:blur(14px);color:var(--ivory);border-bottom:1px solid #c8a96a33}
.nav{max-width:1200px;margin:auto;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;align-items:center;gap:12px;font:500 25px 'Cormorant Garamond',serif;letter-spacing:.14em}
.brand img{width:40px;height:40px;object-fit:contain;border-radius:50%;background:#fff;border:1px solid var(--gold)}
.nav-links{display:flex;gap:34px;font-size:14px;letter-spacing:.06em}.nav-links a{padding:4px 0;border-bottom:1px solid transparent;transition:.25s}.nav-links a:hover{color:var(--gold);border-color:var(--gold)}
.nav-cta,.btn{display:inline-block;background:var(--gold);color:var(--noir);border:1px solid var(--gold);border-radius:0;padding:13px 28px;font:500 14px 'Jost',sans-serif;letter-spacing:.08em;cursor:pointer;transition:.3s}
.btn:hover,.nav-cta:hover{background:transparent;color:var(--gold)}
.nav-cta{padding:10px 20px}
.eyebrow{font:italic 500 19px 'Cormorant Garamond',serif;color:var(--gold)}
